<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>Guias Dsoon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eceae6; --panel:#f8f7f4; --ink:#1d1f22; --muted:#5f6268; --line:#d6d3cd; --accent:#b3171d;
  --display:"Teko","Oswald","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --panel:#1c1e21; --ink:#e7e5e1; --muted:#9a9ca1; --line:#2e3135; --accent:#e0464b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141517; --panel:#1c1e21; --ink:#e7e5e1; --muted:#9a9ca1; --line:#2e3135; --accent:#e0464b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:10px}
h1{font-family:var(--display);font-weight:600;font-size:2.6rem;line-height:1;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:.5rem 0 0}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 8px}
.list{display:grid;gap:10px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;padding:14px 14px 12px}
a.card:active{transform:scale(.99)}
.jogo{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.titulo{font-family:var(--display);font-weight:500;font-size:1.7rem;line-height:1.05;margin:2px 0 4px}
.resumo{margin:0;color:var(--muted);font-size:.9rem}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog b{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:4.5rem}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--c,var(--accent))}
.empty{color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px;padding:14px;margin-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head><body>
<div class="wrap">
  <header><img src="icons/icon-192.png" alt=""><div><h1>Guias Dsoon</h1></div></header>
  <p class="sub">Checklists de coletáveis e progresso dos meus jogos. Tudo fica salvo no celular e funciona sem internet.</p>
  <p class="lbl">Guias</p>
  <div class="list" id="list"></div>
  <p class="empty">Mais jogos em breve.</p>
</div>
<script src="guias.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function feitos(chave){try{return Object.keys(JSON.parse(localStorage.getItem(chave)||"{}")||{}).length}catch(e){return 0}}
function render(){
  document.getElementById("list").innerHTML=(window.GUIAS||[]).map(g=>{
    const f=Math.min(feitos(g.chave),g.total), pct=g.total?100*f/g.total:0;
    return `<a class="card" href="${esc(g.caminho)}" style="--c:${esc(g.cor||"")}">
      <div class="jogo">${esc(g.jogo)}</div>
      <div class="titulo">${esc(g.titulo)}</div>
      <p class="resumo">${esc(g.resumo)}</p>
      <div class="prog"><b>${f}/${g.total}</b><span class="meter"><i style="width:${pct}%"></i></span></div>
    </a>`}).join("");
}
render();
addEventListener("pageshow",render);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
